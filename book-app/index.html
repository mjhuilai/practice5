<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书收藏</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
    #book-form { margin-bottom: 8px; }
    #book-form input { margin-right: 8px; margin-bottom: 4px; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; }
    #search-input { margin: 8px 0; }
    li { margin: 8px 0; }
    .btn { margin-left: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>图书收藏</h1>
  <form id="book-form">
    <input type="text" id="book-title" placeholder="书名">
    <input type="text" id="book-author" placeholder="作者">
    <input type="number" id="book-score" placeholder="评分(0-10)">
    <button type="submit" id="submit-btn">添加</button>
  </form>
  <p class="tip" id="tip"></p>
  <input type="search" id="search-input" placeholder="搜索书名或作者">
  <ul id="book-list"></ul>
  <script src="app.js"></script>
</body>
</html>
